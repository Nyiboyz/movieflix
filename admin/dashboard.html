<form id="addMovieForm">
        <label>Movie Title</label>
        <input type="text" id="title" required placeholder="e.g., Inception">

        <label>URL Slug (No spaces)</label>
        <input type="text" id="slug" required placeholder="e.g., inception-2010">

        <label>Description</label>
        <textarea id="description" rows="3" placeholder="Movie synopsis..."></textarea>

        <!-- NEW CATEGORY DROPDOWN -->
        <label>Category / Genre</label>
        <select id="category">
            <option value="Action">Action</option>
            <option value="Thriller">Thriller</option>
            <option value="Crime">Crime</option>
            <option value="Drama">Drama</option>
            <option value="Comedy">Comedy</option>
            <option value="Series">Series</option>
        </select>

        <label>Poster Image URL</label>
        <input type="url" id="poster_url" required placeholder="https://link-to-image.jpg">

        <label>Telegram Message ID (Number only)</label>
        <input type="number" id="telegram_id" required placeholder="e.g., 5">

        <label>Status</label>
        <select id="status">
            <option value="published">Published</option>
            <option value="draft">Draft (Hidden)</option>
        </select>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">SAVE MOVIE</button>
        <p id="status-msg" style="text-align: center; margin-top: 10px;"></p>
    </form>
