<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIEFLIX</title>
    <!-- Load Supabase -->
    <!-- Replace the Supabase CDN link with these three Firebase links -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #0b0c10; color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        .navbar { padding: 20px 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); font-size: 24px; font-weight: bold; color: #e50914; letter-spacing: 2px; }
        .container { padding: 40px; }
        h2 { border-left: 4px solid #e50914; padding-left: 10px; margin-bottom: 20px; }
        .movie-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .movie-card { background-color: #1f2833; border-radius: 8px; padding: 15px; width: 220px; text-align: center; transition: transform 0.3s; }
        .movie-card:hover { transform: scale(1.05); }
        .movie-title { font-size: 18px; font-weight: bold; margin: 10px 0; }
        .btn { background-color: #e50914; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; font-weight: bold; margin-top: 10px; width: 80%; }
        .btn:hover { background-color: #b8070f; }
    </style>
</head>
<body>

    <div class="navbar">MOVIEFLIX</div>

    <div class="container">
        <h2>Latest Movies</h2>
        <div class="movie-grid" id="movie-container">
            <!-- Movies will be injected here by app.js -->
            <p>Loading movies...</p>
        </div>
    </div>

    <!-- Load your scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
