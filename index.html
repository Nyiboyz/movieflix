<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix</title>
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --net-red: #E50914;
            --bg-color: #141414;
        }
        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 4%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            position: fixed;
            top: 0;
            width: 92%;
            z-index: 100;
        }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .nav-left h1 { color: var(--net-red); margin: 0; font-size: 28px; letter-spacing: 2px; font-weight: 900;}
        .nav-links a { color: #e5e5e5; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.3s;}
        .nav-links a:hover { color: white; }
        .nav-right { display: flex; align-items: center; gap: 20px; font-size: 18px; cursor: pointer;}
        
        /* HERO PADDING */
        .spacer { height: 90px; }

        /* MOVIE ROWS */
        .row-container { margin: 20px 0 40px 4%; position: relative;}
        .row-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .movie-row {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
            scroll-behavior: smooth;
        }
        /* Hide scrollbar for clean Netflix look */
        .movie-row::-webkit-scrollbar { display: none; }
        .movie-row { -ms-overflow-style: none; scrollbar-width: none; }

        /* MOVIE CARD */
        .movie-card {
            min-width: 200px;
            max-width: 200px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
        }
        .movie-card:hover {
            transform: scale(1.08);
            z-index: 10;
        }
        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 4px;
        }
        .movie-card .play-btn {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background-color: var(--net-red);
            color: white;
            text-align: center;
            padding: 8px 0;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .movie-card:hover .play-btn { opacity: 1; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="nav-left">
            <h1>MOVIEFLIX</h1>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">TV Shows</a>
                <a href="#">Movies</a>
                <a href="#">Latest</a>
                <a href="#">My List</a>
            </div>
        </div>
        <div class="nav-right">
            <i class="fa fa-search" title="Search"></i>
            <i class="fa fa-bell" title="Notifications"></i>
            <i class="fa fa-user-circle" style="font-size: 24px;" title="Profile"></i>
        </div>
    </div>

    <div class="spacer"></div>

    <!-- Latest Movies Row -->
    <div class="row-container">
        <div class="row-title">Latest Releases</div>
        <div class="movie-row" id="latest-movies">
            <!-- Movies injected here by app.js -->
        </div>
    </div>

    <!-- Best Rated Row -->
    <div class="row-container">
        <div class="row-title">Best Rated Movies</div>
        <div class="movie-row" id="best-rated-movies">
            <!-- Movies injected here by app.js -->
        </div>
    </div>

    <!-- Load Config and App Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
